name: Drop
description: 'Drop (formerly Massdrop) is a consumer e-commerce brand operated by Corsair that sells
  limited-edition, community-driven products across mechanical keyboards, audiophile gear, and licensed
  gaming collaborations (Fallout, Cyberpunk 2077, The Witcher, Call of Duty and others). Founded in San
  Francisco and backed by Cowboy Ventures and other investors before its acquisition by Corsair, Drop
  runs a direct-to-consumer storefront at drop.com with a Zendesk-based support helpdesk. It is a retail
  brand with no public developer API program; this API Evangelist profile tracks it as a company in the
  network.'
